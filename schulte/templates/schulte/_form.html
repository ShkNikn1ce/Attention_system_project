{% if form.non_field_errors %}
  {% for error in form.non_field_errors %}
    <p class="banner bad">{{ error }}</p>
  {% endfor %}
{% endif %}
{% for field in form %}
  <label class="field">
    <span>{{ field.label }}</span>
    {{ field }}
    {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
  </label>
{% endfor %}
